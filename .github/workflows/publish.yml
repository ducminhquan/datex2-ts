name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'stage = queue for approval (no 2FA); publish = go straight to the registry (needs trusted publishing or a 2FA-capable token)'
        type: choice
        options: [stage, publish]
        default: stage

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Staged publishing needs npm >= 11.15.0; the runner ships an older one.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci

      # Explicit, so the tarball is built and verified whether or not the
      # staging flow runs the prepublishOnly lifecycle script.
      - run: npm run generate
      - name: Model is in sync with the vendored schemas
        run: git diff --exit-code src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npx tsup

      # `stage` queues the version for a human to approve with
      # `npm stage approve`, which is where proof-of-presence is required.
      # Neither mode can create a package that does not exist on the registry
      # yet - the first release of a new name has to be published by hand.
      - name: Release
        env:
          MODE: ${{ inputs.mode || 'stage' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$MODE" = 'publish' ]; then
            npm publish --provenance --access public
          else
            npm stage publish . --provenance --access public
          fi

      - name: Show what is awaiting approval
        if: always()
        run: npm stage list datex2-ts || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

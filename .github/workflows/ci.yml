name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Model is in sync with the vendored schemas
        run: |
          npm run generate
          git diff --exit-code src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npx tsup

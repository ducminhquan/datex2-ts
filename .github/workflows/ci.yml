name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Commit messages follow Conventional Commits
        if: matrix.node == '22'
        env:
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          base="$PUSHED_FROM"
          case "$base" in ''|0000000000000000000000000000000000000000) base=HEAD~1 ;; esac
          npx commitlint --from="$base" --to=HEAD --verbose
      - name: Model is in sync with the vendored schemas
        run: |
          npm run generate
          git diff --exit-code src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npx tsup
